name: Inkfall
options:
  bundleIdPrefix: com.wasteland
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    # Pinned to the same version as Package.swift and Package.resolved.
    exactVersion: "1.1.1"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # In-app updates. Pinned to the same version as Package.swift and Package.resolved.
    exactVersion: "2.10.1"

targets:
  Inkfall:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Inkfall
      - path: Resources/Assets.xcassets
      # Licence texts of the packages Inkfall is built with, shipped inside the app.
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      # On-device rewrite via Apple Intelligence (FoundationModels ships with
      # macOS 26, the deployment minimum, so linked normally).
      - sdk: FoundationModels.framework
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: Inkfall
        CFBundleDisplayName: Inkfall
        # Without these XcodeGen writes a literal 1.0 / 1 into Info.plist, and the version
        # and build number a release passes to xcodebuild never reach the app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required by the distribution pipeline; Inkfall is a menu-bar utility.
        LSApplicationCategoryType: public.app-category.utilities
        # Menu-bar / agent app: no Dock icon (matches NSApp .accessory policy).
        LSUIElement: true
        # Required so the microphone permission prompt shows a real reason and the
        # grant persists to this app's bundle identifier.
        NSMicrophoneUsageDescription: "Inkfall transcribes your speech into text entirely on this Mac. Audio never leaves your device."
        # In-app updates (Sparkle). The feed is a file attached to every GitHub release; this
        # address always resolves to the newest release's copy.
        SUFeedURL: "https://github.com/wasteland-labs-llc/inkfall/releases/latest/download/appcast.xml"
        # Public half of the key every update is signed with. The private half is not in any
        # repository. An update that this key does not verify is refused.
        SUPublicEDKey: "HW4TOeYthYM4K55vHkeQj3jn4O3ecMLB2DT21HXq/WU="
        # No check unless the user asks for one or turns the switch on in Settings. Present,
        # this key also stops Sparkle from asking at the second launch.
        SUEnableAutomaticChecks: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wasteland.Inkfall
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Same fix as Package.swift: the beta OS crashes on Swift 6's dynamic
        # actor-isolation runtime assertion for @objc @MainActor AppKit actions.
        OTHER_SWIFT_FLAGS: "-disable-dynamic-actor-isolation"
        # Automatic signing; set your own team in Xcode, or keep a local overlay spec
        # (e.g. project.local.yml including this file and adding DEVELOPMENT_TEAM) and
        # generate with `xcodegen generate --spec project.local.yml`.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        # Notarization requires the Hardened Runtime. Non-sandboxed (see entitlements)
        # so Accessibility-based text insertion keeps working.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Inkfall.entitlements
