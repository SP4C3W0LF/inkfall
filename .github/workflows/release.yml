name: Release

# Builds Inkfall on a GitHub-hosted Mac (free for public repos), so a release no longer
# waits for a particular Mac to be awake. Tag push = signed, notarized DMG on a GitHub
# release. Manual run = dry run: archive + unsigned DMG, no secrets touched.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  dry-run:
    if: github.repository == 'SP4C3W0LF/inkfall' && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27   # GitHub image label: one major Xcode per image (macOS 27, Apple Silicon)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        # Inkfall uses AVFAudio APIs from the macOS 27 SDK (installAudioTap, AVReadOnlyAudioPCMBuffer),
        # and the image's default Xcode can be a major version behind.
        run: |
          X="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          "$X/Contents/Developer/usr/bin/xcodebuild" -version
      - run: brew install xcodegen
      - run: ci/release.sh 0.0.0-ci --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: Inkfall-dryrun
          path: dist/Inkfall-dryrun.dmg
          retention-days: 7

  release:
    if: github.repository == 'SP4C3W0LF/inkfall' && startsWith(github.ref, 'refs/tags/v')
    runs-on: xcode-27   # GitHub image label: one major Xcode per image (macOS 27, Apple Silicon)
    timeout-minutes: 90
    # The signing secrets live only in this environment, which is restricted to v* tags.
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        # Inkfall uses AVFAudio APIs from the macOS 27 SDK (installAudioTap, AVReadOnlyAudioPCMBuffer),
        # and the image's default Xcode can be a major version behind.
        run: |
          X="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          "$X/Contents/Developer/usr/bin/xcodebuild" -version
      - run: brew install xcodegen create-dmg
      - name: Build, sign, notarize, package
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ci/release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Inkfall.dmg" \
            --title "Inkfall ${GITHUB_REF_NAME#v}" \
            --generate-notes
